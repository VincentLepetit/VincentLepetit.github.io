<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoneme Master: English Pronunciation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sound-btn {
            transition: all 0.2s;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
        }
        .sound-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
        }
        .sound-btn.correct { background-color: #22c55e !important; box-shadow: 0 4px 0 #166534; }
        .sound-btn.wrong { background-color: #ef4444 !important; box-shadow: 0 4px 0 #991b1b; }
        
        /* Animation for new word */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-next { animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-4 md:p-8">

    <div class="max-w-4xl w-full bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-700">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                Phoneme Master
            </h1>
            <p class="text-slate-400 text-sm mt-2">Listen to the word and select the sounds in order.</p>
        </header>

        <!-- Game Stats -->
        <div class="flex justify-between mb-8 px-4 py-2 bg-slate-900/50 rounded-xl border border-slate-700">
            <div>Score: <span id="score" class="font-bold text-emerald-400">0</span></div>
            <div>Level: <span id="level" class="font-bold text-blue-400">1</span></div>
            <div>Words: <span id="word-count" class="font-bold text-slate-300">0</span></div>
        </div>

        <!-- Word Display / Play Button -->
        <div class="flex flex-col items-center mb-10">
            <button id="play-btn" class="w-24 h-24 bg-blue-600 rounded-full flex items-center justify-center hover:bg-blue-500 transition-all shadow-lg group active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                </svg>
            </button>
            <p id="feedback" class="mt-4 h-8 font-medium text-lg text-center"></p>
        </div>

        <!-- Input Progress -->
        <div id="answer-slots" class="flex flex-wrap gap-2 justify-center mb-10 min-h-[3rem]">
            <!-- Slots will appear here -->
        </div>

        <!-- Legend -->
        <div class="flex gap-6 justify-center mb-6 text-xs uppercase tracking-widest font-bold opacity-80">
            <div class="flex items-center gap-2">
                <span class="w-4 h-4 bg-emerald-600 rounded shadow-sm"></span> 
                <span class="text-emerald-400">Vowels</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-4 h-4 bg-blue-700 rounded shadow-sm"></span> 
                <span class="text-blue-400">Consonants</span>
            </div>
        </div>

        <!-- Sound Buttons Grid -->
        <div id="sound-grid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-3 mb-8">
            <!-- Buttons generated by JS -->
        </div>

        <div class="flex justify-center gap-4">
            <button id="skip-btn" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 rounded-full text-sm font-semibold transition-colors">Skip word</button>
        </div>
    </div>

    <script>
        const phonemeAudioMap = {
            'AA': '', 'AH': '', 'ai': 'eye', 'AIR': 'air', 'EH': 'eh', 'UH': 'uh', 'uh': 'a', 'ER': 'er', 'OO': 'oo', 'U': 'you', 
            'AW': 'awe', 'O': 'oh', 'E': 'eh', 'EY': 'ay', 
            'OY': 'oy', 'OH': 'oh', 'OW': 'ow', 'AR': 'ar', 'OR': 'or', 'EAR': 'ear', 
            'P': 'puh', 'B': 'buh', 'T': 'tuh', 'D': 'duh', 'K': 'kuh', 'G': 'guh', 'M': 'muh', 
            'N': 'nuh', 'NG': 'ing', 'F': 'fuh', 'V': 'vuh', 'th': 'thuh', 'TH': 'thee', 'S': 'suh', 
            'Z': 'zuh', 'SH': 'shuh', 'ZH': 'zhoo', 'H': 'huh', 'R': 'ruh', 'Y': 'yuh', 'W': 'wuh', 
            'L': 'luh', 'CH': 'chuh', 'J': 'juh', 'DD': 'duh', 'IH': 'ih', 'EE': 'ee'
        };

        const vowelsList = [
            'AA', 'EH', 'UH', 'uh', 'ER', 'OO', 'U', 'AW', 'AH', 'O', 'E', 'EY', 'ai', 
            'OY', 'OH', 'OW', 'AR', 'OR', 'AIR', 'EAR', 'IH', 'EE'
        ];

        const dictionary = [
            // { word: 'bed',  sounds: ['B', 'EH', 'D'] },
            // { word: 'blue', sounds: ['B', 'L', 'OO'] },
            // { word: 'boat', sounds: ['B', 'OH', 'T'] },
            // { word: 'boy',  sounds: ['B', 'OY'] },
            // { word: 'brush', sounds: ['B', 'R', 'UH', 'SH'] },
            { word: 'BRUHSH', sounds: ['B', 'R', 'UH', 'SH'] },
            // { word: 'cake', sounds: ['K', 'EY', 'K'] },
            // { word: 'cat',  sounds: ['K', 'AA', 'T'] },
            // { word: 'chip', sounds: ['CH', 'IH', 'P'] },
            // { word: 'cup',  sounds: ['K', 'UH', 'P'] },
            // { word: 'can\'t',  sounds: ['K', 'AA', 'N', 'T'] },            
            // { word: 'cloud', sounds: ['K', 'L', 'OW', 'D'] },
            // { word: 'dog',  sounds: ['D', 'AH', 'G'] },
            // { word: 'duck', sounds: ['D', 'UH', 'K'] },
            // { word: 'fish', sounds: ['F', 'IH', 'SH'] },
            // { word: 'frog', sounds: ['F', 'R', 'AH', 'G'] },
            // { word: 'king', sounds: ['K', 'IH', 'NG'] },
            // { word: 'kitchen', sounds: ['K', 'IH', 'CH', 'IH', 'N'] },
            { word: 'KIHCHIHN', sounds: ['K', 'IH', 'CH', 'IH', 'N'] },
            { word: 'LAAMP', sounds: ['L', 'AA', 'M', 'P'] },
            { word: 'LaiT', sounds: ['L', 'ai', 'T'] }
            // { word: 'lamp', sounds: ['L', 'AA', 'M', 'P'] },
            // { word: 'light', sounds: ['L', 'ai', 'T'] },
            // { word: 'pig',  sounds: ['P', 'IH', 'G'] },
            // { word: 'seek', sounds: ['S', 'EE', 'K'] },
            // { word: 'ship', sounds: ['SH', 'IH', 'P'] },
            // { word: 'sing', sounds: ['S', 'IH', 'NG'] },
            // { word: 'stay', sounds: ['S', 'T', 'EY'] },
            // { word: 'think', sounds: ['th', 'IH', 'NG', 'K'] },
            // { word: 'this', sounds: ['TH', 'IH', 'S'] }
            // { word: 'bird', sounds: ['B', 'ER', 'D'] },
            // { word: 'car', sounds: ['K', 'AR'] },
            // { word: 'fork', sounds: ['F', 'OR', 'K'] },
            // { word: 'hair', sounds: ['H', 'AIR'] },
            // { word: 'near', sounds: ['N', 'EAR'] },
            // { word: 'nurse', sounds: ['N', 'ER', 'S'] },
            // { word: 'winter', sounds: ['W', 'IH', 'N', 'T', 'ER'] },
            // { word: 'sandwich', sounds: ['S', 'A', 'N', 'D', 'W', 'IH', 'CH'] },
            // { word: 'father', sounds: ['F', 'AA', 'TH', 'ER'] },
            // { word: 'shouted', sounds: ['SH', 'OW', 'T', 'IH', 'D'] },
            // { word: 'flavour', sounds: ['F', 'L', 'EY', 'V', 'ER'] },
            // { word: 'yellow', sounds: ['Y', 'EH', 'L', 'OH'] },
            // { word: 'planet', sounds: ['P', 'L', 'A', 'N', 'EH', 'T'] },
            // { word: 'treasure', sounds: ['T', 'R', 'EH', 'ZH', 'ER'] },
            // { word: 'orange', sounds: ['OR', 'EH', 'N', 'J'] },
            // { word: 'music', sounds: ['M', 'U', 'Z', 'IH', 'K'] },
            // { word: 'dragon', sounds: ['D', 'R', 'A', 'G', 'uh', 'N'] },
            // { word: 'bottle', sounds: ['B', 'O', 'T', 'L'] },
            // { word: 'button', sounds: ['B', 'UH', 'T', 'uh', 'N'] },
            // { word: 'judge', sounds: ['J', 'AH', 'J'] },
            // { word: 'through', sounds: ['th', 'R', 'OO'] },
            // { word: 'vision', sounds: ['V', 'IH', 'ZH', 'uh', 'N'] },
            // { word: 'church', sounds: ['CH', 'ER', 'CH'] },
            // { word: 'palm', sounds: ['P', 'AA', 'M'] },
            // { word: 'crisp', sounds: ['K', 'R', 'IH', 'S', 'P'] },
            // { word: 'strength', sounds: ['S', 'T', 'R', 'EH', 'NG', 'th'] },
            // { word: 'splash', sounds: ['S', 'P', 'L', 'A', 'SH'] },
            // { word: 'box', sounds: ['B', 'O', 'K', 'S'] },
            // { word: 'quick', sounds: ['K', 'W', 'IH', 'K'] },
            // { word: 'square', sounds: ['S', 'K', 'W', 'AIR'] },
            // { word: 'ghost', sounds: ['G', 'OH', 'S', 'T'] },
            // { word: 'ocean', sounds: ['OH', 'SH', 'uh', 'N'] },
            // { word: 'sugar', sounds: ['SH', 'UH', 'G', 'ER'] },
            // { word: 'laugh', sounds: ['L', 'A', 'F'] },
            // { word: 'tough', sounds: ['T', 'UH', 'F'] },
            // { word: 'brought', sounds: ['B', 'R', 'OR', 'T'] },
            // { word: 'walk', sounds: ['W', 'OR', 'K'] },
            // { word: 'knee', sounds: ['N', 'EE'] },
            // { word: 'write', sounds: ['R', 'ai', 'T'] },
            // { word: 'climb', sounds: ['K', 'L', 'ai', 'M'] },
            // { word: 'bridge', sounds: ['B', 'R', 'IH', 'J'] },
            // { word: 'scared', sounds: ['S', 'K', 'AIR', 'D'] },
            // { word: 'shadow', sounds: ['SH', 'A', 'D', 'OH'] }
        ];

        const rawSounds = Object.keys(phonemeAudioMap);
        const allSounds = [...new Set(rawSounds)].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

        let currentWord = null;
        let playerSelection = [];
        let score = 0;
        let completedCount = 0;
        let isProcessing = false;

        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const countEl = document.getElementById('word-count');
        const feedbackEl = document.getElementById('feedback');
        const soundGrid = document.getElementById('sound-grid');
        const answerSlots = document.getElementById('answer-slots');
        const playBtn = document.getElementById('play-btn');
        const skipBtn = document.getElementById('skip-btn');

        const synth = window.speechSynthesis;

        function init() {
            createButtons();
            nextRound();
        }

        function createButtons() {
            soundGrid.innerHTML = '';
            allSounds.forEach(sound => {
                const isVowel = vowelsList.includes(sound);
                const btn = document.createElement('button');
                const colorClass = isVowel ? "bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700" : "bg-blue-700 hover:bg-blue-600 active:bg-blue-800";
                btn.className = `sound-btn ${colorClass} py-3 px-1 rounded-xl font-bold text-sm md:text-base transition-all active:scale-90`;
                btn.textContent = sound;
                btn.onclick = () => {
                    // speakPhoneme(sound);
                    handleSoundClick(sound, btn);
                };
                soundGrid.appendChild(btn);
            });
        }

        function speakPhoneme(phoneme) {
            if (synth.speaking) synth.cancel();
            const textToSpeak = phonemeAudioMap[phoneme] || phoneme;
            const utter = new SpeechSynthesisUtterance(textToSpeak);
            utter.lang = 'en-US';
            utter.rate = 1.1;
            utter.pitch = 1.2;
            synth.speak(utter);
        }

         function playCorrectSound() {
            if (synth.speaking) synth.cancel();
            const utter = new SpeechSynthesisUtterance("Ding!");
            utter.pitch = 2;
            utter.rate = 2;
            utter.volume = 0.5;
            synth.speak(utter);
        }

        function playWrongSound() {
            if (synth.speaking) synth.cancel();
            const utter = new SpeechSynthesisUtterance("Uh-oh.");
            utter.pitch = 0.5;
            utter.rate = 1.5;
            utter.volume = 0.5;
            synth.speak(utter);
        }
        
        function handleSoundClick(sound, btn) {
            if (isProcessing || !currentWord) return;
            playerSelection.push(sound);
            updateSlots();
            const currentIndex = playerSelection.length - 1;
            if (playerSelection[currentIndex] !== currentWord.sounds[currentIndex]) {
                playWrongSound();                
                showFeedback("Not that sound! Listen again.", "text-red-400");
                btn.classList.add('wrong');
                setTimeout(() => {
                    btn.classList.remove('wrong');
                    playerSelection.pop();
                    updateSlots();
                }, 400);
            } else {
                playCorrectSound();                
                btn.classList.add('correct');
                setTimeout(() => btn.classList.remove('correct'), 300);
                if (playerSelection.length === currentWord.sounds.length) {
                    winRound();
                }
            }
        }

        function winRound() {
            isProcessing = true;
            score += (currentWord.sounds.length * 5);
            completedCount++;
            
            scoreEl.textContent = score;
            countEl.textContent = completedCount;
            levelEl.textContent = Math.floor(completedCount / 5) + 1;
            
            showFeedback(`Awesome! That's "${currentWord.word.toUpperCase()}"`, "text-emerald-400");
            
            // Re-say the word upon success
            speakWord();
            
            setTimeout(() => {
                nextRound();
                isProcessing = false;
            }, 1800);
        }

        function nextRound() {
            playerSelection = [];
            currentWord = dictionary[Math.floor(Math.random() * dictionary.length)];
            showFeedback("");
            updateSlots();
            answerSlots.classList.remove('animate-next');
            void answerSlots.offsetWidth; 
            answerSlots.classList.add('animate-next');
            speakWord();
        }

        function updateSlots() {
            answerSlots.innerHTML = '';
            for (let i = 0; i < currentWord.sounds.length; i++) {
                const slot = document.createElement('div');
                slot.className = "w-14 h-14 bg-slate-900/50 rounded-xl border-2 border-slate-700 flex items-center justify-center font-bold text-xl transition-all";
                if (playerSelection[i]) {
                    slot.textContent = playerSelection[i];
                    slot.classList.add('border-emerald-500', 'text-emerald-400', 'bg-emerald-900/20', 'scale-105');
                } else {
                    slot.textContent = '?';
                    slot.classList.add('text-slate-600');
                }
                answerSlots.appendChild(slot);
            }
        }

        function speakWord() {
            if (synth.speaking) synth.cancel();
            const utter = new SpeechSynthesisUtterance(currentWord.word);
            utter.lang = 'en-US';
            utter.rate = 0.75;
            synth.speak(utter);
        }

        function showFeedback(msg, colorClass = "text-white") {
            feedbackEl.textContent = msg;
            feedbackEl.className = "mt-4 h-8 font-medium text-lg text-center " + colorClass;
        }

        playBtn.onclick = speakWord;
        skipBtn.onclick = nextRound;
        window.onload = init;
    </script>
</body>
</html>
